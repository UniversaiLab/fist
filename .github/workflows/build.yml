name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pinned so all three platforms build against the exact same sing-box
  # release this app's config/process code was written and tested against
  # (packages/core-logic/singboxConfig.js, packages/desktop/electron/lib/singboxProcess.cjs).
  # sing-box's config schema is version-sensitive -- bump deliberately.
  SINGBOX_VERSION: v1.13.14

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            script: dist
          - os: macos-latest
            platform: darwin
            script: dist:mac
          - os: ubuntu-latest
            platform: linux
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Built from source (not downloaded release archives) so this doesn't
      # depend on guessing sing-box's release-asset naming convention per OS --
      # go install cross-builds identically on every runner.
      - name: Build sing-box core
        shell: bash
        run: |
          set -e
          go install -tags "with_quic,with_grpc,with_utls,with_clash_api,with_v2ray_api" \
            "github.com/sagernet/sing-box/cmd/sing-box@${SINGBOX_VERSION}"
          mkdir -p "packages/desktop/bin/${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            cp "$(go env GOPATH)/bin/sing-box.exe" "packages/desktop/bin/win32/sing-box.exe"
          else
            cp "$(go env GOPATH)/bin/sing-box" "packages/desktop/bin/${{ matrix.platform }}/sing-box"
            chmod +x "packages/desktop/bin/${{ matrix.platform }}/sing-box"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: soul-connection-${{ matrix.platform }}
          path: packages/desktop/release/**
          if-no-files-found: warn
